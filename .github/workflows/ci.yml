name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit (diagnostic)
        run: |
          npm audit --json > npm-audit-full.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e "
            const fs = require('node:fs');
            const summarize = (file) => {
              const report = JSON.parse(fs.readFileSync(file, 'utf8'));
              return {
                counts: report.metadata?.vulnerabilities ?? {},
                packages: Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
                  name,
                  severity: item.severity,
                  direct: item.isDirect,
                  range: item.range,
                  fixAvailable: item.fixAvailable,
                  advisories: item.via.map((entry) => typeof entry === 'string' ? entry : {
                    title: entry.title,
                    url: entry.url,
                    range: entry.range
                  })
                }))
              };
            };
            const full = summarize('npm-audit-full.json');
            const production = summarize('npm-audit-production.json');
            console.log('FULL DEPENDENCY AUDIT');
            console.log(JSON.stringify(full, null, 2));
            console.log('PRODUCTION DEPENDENCY AUDIT');
            console.log(JSON.stringify(production, null, 2));
            const highOrCritical = (counts) => (counts.high ?? 0) + (counts.critical ?? 0);
            if (highOrCritical(full.counts) > 0 || highOrCritical(production.counts) > 0) {
              console.error('High or critical dependency vulnerabilities remain.');
              process.exitCode = 1;
            }
          "

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Data-layer verification tests
        run: npm run verify

      - name: Production build
        run: npm run build
